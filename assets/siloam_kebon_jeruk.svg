<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" class="w-full h-full">
  <defs>
    <linearGradient id="skyKJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EE7C22" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EE7C22" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#skyKJ)"/>
  <rect y="320" width="600" height="60" fill="#e2e8f0"/>
  <!-- Main Curved Hospital Wing -->
  <rect x="110" y="80" width="380" height="240" rx="12" fill="#ffffff" stroke="#EE7C22" stroke-width="3"/>
  <!-- Top Signage Bar -->
  <rect x="110" y="80" width="380" height="40" rx="6" fill="#EE7C22"/>
  <text x="300" y="105" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">SILOAM HOSPITALS KEBON JERUK</text>
  <!-- Cross -->
  <rect x="130" y="92" width="20" height="7" rx="1" fill="#ffffff"/>
  <rect x="136.5" y="85.5" width="7" height="20" rx="1" fill="#ffffff"/>
  <!-- Urology & Cardiology Center Badge -->
  <rect x="180" y="135" width="240" height="26" rx="13" fill="#0094D6" opacity="0.15"/>
  <text x="300" y="152" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0094D6" text-anchor="middle">CENTER OF EXCELLENCE • UROLOGY &amp; CARDIOLOGY</text>
  <!-- Window Matrix -->
  <g fill="#64748b" opacity="0.6">
    <!-- Row 1 -->
    <rect x="140" y="175" width="65" height="25" rx="3"/>
    <rect x="220" y="175" width="65" height="25" rx="3"/>
    <rect x="300" y="175" width="65" height="25" rx="3"/>
    <rect x="380" y="175" width="65" height="25" rx="3"/>
    <!-- Row 2 -->
    <rect x="140" y="215" width="65" height="25" rx="3"/>
    <rect x="220" y="215" width="65" height="25" rx="3"/>
    <rect x="300" y="215" width="65" height="25" rx="3"/>
    <rect x="380" y="215" width="65" height="25" rx="3"/>
    <!-- Row 3 -->
    <rect x="140" y="255" width="65" height="25" rx="3"/>
    <rect x="220" y="255" width="65" height="25" rx="3"/>
    <rect x="300" y="255" width="65" height="25" rx="3"/>
    <rect x="380" y="255" width="65" height="25" rx="3"/>
  </g>
  <!-- Ambulance Bay -->
  <rect x="230" y="285" width="140" height="35" rx="4" fill="#0f172a"/>
  <text x="300" y="306" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">AMBULANCE BAY</text>
</svg>