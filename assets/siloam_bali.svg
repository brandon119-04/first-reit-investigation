<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" class="w-full h-full">
  <defs>
    <linearGradient id="skyBali" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94C13D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#94C13D" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#skyBali)"/>
  <rect y="320" width="600" height="60" fill="#e2e8f0"/>
  <!-- Balinese Temple Inspired Modern Hospital Facade -->
  <polygon points="160,80 300,40 440,80 430,95 170,95" fill="#D32577"/>
  <rect x="140" y="95" width="320" height="225" rx="8" fill="#ffffff" stroke="#94C13D" stroke-width="3"/>
  <text x="300" y="130" font-family="sans-serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">SILOAM HOSPITALS BALI</text>
  <text x="300" y="148" font-family="sans-serif" font-size="10" font-weight="bold" fill="#D32577" text-anchor="middle">SUNSET ROAD, KUTA • INTERNATIONAL MEDICAL TOURISM</text>
  <!-- Windows & Louvers -->
  <g fill="#0284c7" opacity="0.7">
    <rect x="170" y="165" width="110" height="40" rx="4"/>
    <rect x="320" y="165" width="110" height="40" rx="4"/>
    <rect x="170" y="220" width="110" height="40" rx="4"/>
    <rect x="320" y="220" width="110" height="40" rx="4"/>
  </g>
  <!-- Palm Trees -->
  <path d="M 80,320 Q 90,240 70,180" stroke="#78350f" stroke-width="6" fill="none"/>
  <circle cx="60" cy="175" r="20" fill="#15803d"/>
  <circle cx="80" cy="165" r="22" fill="#94C13D"/>
  <path d="M 520,320 Q 510,240 530,180" stroke="#78350f" stroke-width="6" fill="none"/>
  <circle cx="540" cy="175" r="20" fill="#15803d"/>
  <circle cx="520" cy="165" r="22" fill="#94C13D"/>
  <!-- Entrance Portico -->
  <polygon points="230,320 370,320 350,280 250,280" fill="#94C13D"/>
  <text x="300" y="305" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">MAIN ENTRANCE</text>
</svg>