<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" class="w-full h-full">
  <defs>
    <linearGradient id="skyJp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0094D6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0094D6" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#skyJp)"/>
  <rect y="320" width="600" height="60" fill="#e2e8f0"/>
  <!-- Contemporary Japanese Elderly Residence -->
  <rect x="130" y="70" width="340" height="250" rx="6" fill="#f8fafc" stroke="#0094D6" stroke-width="3"/>
  <!-- Pitched Japanese Eaves Roof -->
  <polygon points="110,75 300,30 490,75 470,85 130,85" fill="#334155"/>
  <text x="300" y="115" font-family="sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">HIKARI HEIGHTS VARUS FUJINO</text>
  <text x="300" y="132" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0094D6" text-anchor="middle">SAPPORO, HOKKAIDO • JAPAN NURSING HOME PORTFOLIO</text>
  <!-- Timber Style Siding Louvers -->
  <g fill="#b45309" opacity="0.75">
    <rect x="160" y="150" width="75" height="35" rx="2"/>
    <rect x="260" y="150" width="75" height="35" rx="2"/>
    <rect x="360" y="150" width="75" height="35" rx="2"/>
    <rect x="160" y="200" width="75" height="35" rx="2"/>
    <rect x="260" y="200" width="75" height="35" rx="2"/>
    <rect x="360" y="200" width="75" height="35" rx="2"/>
    <rect x="160" y="250" width="75" height="35" rx="2"/>
    <rect x="260" y="250" width="75" height="35" rx="2"/>
    <rect x="360" y="250" width="75" height="35" rx="2"/>
  </g>
  <!-- Japanese Garden Pine -->
  <polygon points="90,320 70,270 110,270" fill="#1e3a1e"/>
  <polygon points="90,275 75,235 105,235" fill="#2d5a27"/>
  <polygon points="90,240 80,205 100,205" fill="#3f7a36"/>
  <!-- Gate -->
  <rect x="260" y="290" width="80" height="30" rx="2" fill="#0094D6"/>
  <text x="300" y="310" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">SENIOR LIVING ENTRY</text>
</svg>